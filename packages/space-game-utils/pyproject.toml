[project]
name = "space-game-utils"
version = "0.1.0"
description = "Fertige Debug-, HTTP- und Hintergrund-Hilfsfunktionen für space-game"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pygame-ce>=2.5.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/space_game_utils"]
