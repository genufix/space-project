[project]
name = "space-game-entities"
version = "0.1.0"
description = "Fertige Player-, Projektil- und Asteroiden-Sprites für space-game"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce>=2.5.7",
    "space-game-physics",
]

[tool.uv.sources]
space-game-physics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/space_game_entities"]
