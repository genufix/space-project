[project]
name = "space-game-ui"
version = "0.1.0"
description = "Fertige Start-, Pause- und Death-Screen-Komponenten für space-game"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce>=2.5.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/space_game_ui"]
